name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []  # add: needs: [test] once test.yml job names are wired to run first in the same workflow
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy hook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      # Swap the step above for a Docker build + push to a registry,
      # then a deploy step (Railway/AWS ECS/Fly.io) if you move off Render.
